<!doctype html><html><head><meta charset="utf-8"><title>Prompt Injection — Noor attack set (art-v12) mockup</title>
<style>
@font-face{font-family:Plex;src:url(../game/public/assets/fonts/IBMPlexMono-Medium.ttf)}
html,body{margin:0;background:#05080b;height:100%;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,177.78vh);aspect-ratio:16/9;display:block}
</style></head><body><canvas id=c width=1280 height=720></canvas>
<script>
// NOOR ATTACK SET MOCKUP (not the game). New Blender sheets from art/tools/noor12.py + pack12.py (mock-attack/assets), played with the
// per-frame timings, hit-stop and events in assets/noor_attacks12.json. ?t=SECONDS freezes a frame; ?mode=compare = old vs new side by side;
// ?mode=close&anim=combo1 = 2x close-up loop of one animation.
const A='../game/public/assets/', cv=document.getElementById('c'), g=cv.getContext('2d');
const W=1280,H=720, TOP=50, BOT=50, R=(H-TOP-BOT)/720, OX=(W-1280*R)/2, OY=TOP, NS=0.78;
const P=(x,y)=>[OX+x*R,OY+y*R];
const img=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
const J=async n=>[await img(A+'sprites/'+n+'.png'),(await (await fetch(A+'sprites/'+n+'.json')).json()).frames];
const ease=u=>u<0?0:u>1?1:u*u*(3-2*u), lerp=(a,b,u)=>a+(b-a)*u, cl=(v,a,b)=>Math.max(a,Math.min(b,v)), seg=(t,a,b)=>cl((t-a)/(b-a),0,1);
let I={};
function rnd(s){return()=>{s=(s*16807)%2147483647;return s/2147483647;}}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function text(s,x,y,size,col,al='center',wt=''){g.font=`${wt} ${size}px Plex`;g.textAlign=al;g.textBaseline='middle';g.fillStyle=col;g.fillText(s,x,y);}
let VIEW=[R,OX,OY];const W2=()=>{g.setTransform(VIEW[0],0,0,VIEW[0],VIEW[1],VIEW[2]);g.globalAlpha=1;}, SC=()=>{g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.filter='none';g.shadowBlur=0;};

// ---- PAINTED LETTERS: each letter its own little textured canvas (paint speckle, worn edges, drips) -------
// style: stencil (cream road-paint with stencil bridges), marker (whiteboard marker), scrawl (charcoal on the dummy), print (printer label)
function makeWord(word,{h,col,font,style,seed,track=1,skew=0}){const rn=rnd(seed),S=4,L=[];let x=0;
  for(const ch of word){const c=document.createElement('canvas'),fs=h*S;const m=c.getContext('2d');m.font=`${font} ${fs}px ${style=='stencil'?"'DejaVu Sans'":"Plex"}`;
    const w=Math.ceil(m.measureText(ch).width)+fs*.4;c.width=w;c.height=fs*1.7;m.font=`${font} ${fs}px ${style=='stencil'?"'DejaVu Sans'":"Plex"}`;m.textBaseline='middle';m.textAlign='center';
    const rot=style=='scrawl'||style=='marker'?(rn()-.5)*.22:0;m.translate(w/2,fs*.75);m.rotate(rot);m.fillStyle=col;
    if(style=='scrawl'){m.lineJoin='round';m.strokeStyle=col;m.lineWidth=fs*.07;m.strokeText(ch,0,0);}
    m.fillText(ch,0,0);m.setTransform(1,0,0,1,0,0);
    m.globalCompositeOperation='destination-out';
    if(style=='stencil'){m.fillRect(w/2-fs*.035,0,fs*.07,c.height);}
    const n=style=='print'?30:160;for(let i=0;i<n;i++){m.globalAlpha=.15+rn()*.6;m.beginPath();m.arc(rn()*w,rn()*c.height,rn()*fs*(style=='marker'?.018:.026),0,7);m.fill();}
    m.globalAlpha=1;m.globalCompositeOperation='source-atop';
    const gr=m.createLinearGradient(0,0,0,c.height);gr.addColorStop(0,'rgba(0,0,0,.28)');gr.addColorStop(.5,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.18)');m.fillStyle=gr;m.fillRect(0,0,w,c.height);
    if(style=='stencil'||style=='scrawl'){m.globalCompositeOperation='source-over';m.fillStyle=col;for(let i=0;i<2;i++){if(rn()<.55){const dx=w*(.25+rn()*.5),dl=fs*(.15+rn()*.35);m.globalAlpha=.8;m.fillRect(dx,fs*1.1,fs*.035,dl);m.beginPath();m.arc(dx+fs*.017,fs*1.1+dl,fs*.03,0,7);m.fill();}}}
    L.push({c,x:x/S,w:w/S,h:c.height/S});x+=(w-fs*.4)*track+fs*.4*(track-1)+fs*.05;}
  const tw=(L.at(-1).x+L.at(-1).w);return {L,tw,h,skew,word,col};}
// draw word at world box centre (cx,cy), width fit; peel = per-letter progress fn returning null (on surface) or {x,y,rot,s,a}
function drawWord(Wd,cx,cy,{a=1,shim=-1,ghost=0,letterAt=null,scaleX=1,rot=0,splat=-1}={}){W2();const sx=scaleX;
  Wd.L.forEach((l,i)=>{let X=cx+(l.x-Wd.tw/2)*sx,Y=cy-l.h/2,lp=letterAt?letterAt(i,X+l.w*sx/2,cy):null;
    if(lp&&lp.off){ if(ghost>0){g.globalAlpha=ghost;g.drawImage(l.c,X,Y,l.w*sx,l.h);} return; }
    g.save();
    if(lp){g.translate(lp.x,lp.y);g.rotate(lp.rot);g.scale(lp.s,lp.s*(lp.sy??1));g.globalAlpha=lp.a;if(lp.glow){g.shadowColor='rgba(255,250,230,.9)';g.shadowBlur=6;}g.drawImage(l.c,-l.w/2,-l.h/2,l.w,l.h);}
    else{g.translate(cx,cy);g.rotate(rot);g.translate(-cx,-cy);g.globalAlpha=a;
      let sq=1;if(splat>=0&&splat<1){const k=cl(splat*3-i*.25,0,1);sq=1+.6*Math.sin(k*Math.PI)*(1-k);g.globalAlpha=a*cl(k*2,0,1);}
      g.translate(X+l.w*sx/2,cy);g.scale(sq,1/sq);g.drawImage(l.c,-l.w*sx/2,-l.h/2,l.w*sx,l.h);
      if(shim>=0){// wet-ink sheen: a soft bright band sweeping through the letter, only on painted pixels
        const t=document.createElement('canvas');t.width=l.c.width;t.height=l.c.height;const m=t.getContext('2d');m.drawImage(l.c,0,0);m.globalCompositeOperation='source-atop';
        const p=((shim*.55-i*.12)%1.4+1.4)%1.4-.2,gr=m.createLinearGradient(t.width*(p-.3),0,t.width*(p+.3),t.height*.6);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(255,255,255,0)');
        m.fillStyle=gr;m.fillRect(0,0,t.width,t.height);g.globalAlpha=a;g.drawImage(t,-l.w*sx/2,-l.h/2,l.w*sx,l.h);}}
    g.restore();});SC();}
function splash(cx,cy,u,col,seed,rad=26){if(u<=0||u>=1)return;const rn=rnd(seed);W2();g.fillStyle=col;
  for(let i=0;i<18;i++){const an=rn()*7,d=rad*(.4+rn())*ease(u*1.6),r=1+rn()*2.6;g.globalAlpha=(1-u)*.95;g.beginPath();g.arc(cx+Math.cos(an)*d,cy+Math.sin(an)*d*.7+u*u*8,r*(1-u*.5),0,7);g.fill();}SC();}
// ---- characters ------------------------------------------------------------
function noorAt(sheet,dir,f,x,y){const [im,fr]=I[sheet];if(!fr)return;const sn=sheet.replace(/^v1:/,''),F=fr[`${sn}_${dir}_${String(f).padStart(2,'0')}`]||fr[`${sn}_S_00`];W2();const s=NS;
  g.globalAlpha=.28;g.fillStyle='#000';g.beginPath();g.ellipse(x,y,24*s,7*s,0,0,7);g.fill();g.globalAlpha=1;g.drawImage(im,F.frame.x,F.frame.y,192,192,x-96*s,y-160*s,192*s,192*s);SC();}
const DV={E:[1,0],W:[-1,0],N:[0,-1],S:[0,1],NE:[.7,-.7],NW:[-.7,-.7],SE:[.7,.7],SW:[-.7,.7]};
function hand(n){const d=DV[n.dir];return {x:n.x+d[0]*20,y:n.y-62+d[1]*6};}
function dirOf(dx,dy){const a=Math.atan2(dy,dx)*180/Math.PI;return ['E','SE','S','SW','W','NW','N','NE'][(Math.round(a/45)+8)%8];}
// carried ink words: tiny, orbiting the hand (no panel, no buttons)
function carried(n,words,t,sel){const h=hand(n);words.forEach((w,i)=>{const an=t*1.6+i*Math.PI*2/words.length,ox=Math.cos(an)*26,oy=Math.sin(an)*9-8;
  const s=sel===i?.8:.6;drawWord(w,0,0,{letterAt:(k,lx)=>({x:h.x+ox+(w.L[k].x-w.tw/2+w.L[k].w/2)*s,y:h.y+oy,rot:0,s,a:Math.sin(an)<-.2?.55:1,glow:sel===i})});});}
// dummy: real render, paper-ified by u, torn by tear
function dummy(u,tear,hit,t,aim){const D=I.D,x0=820-27,y0=610-158;W2();
  const draw=(clip,dx,dy,r)=>{g.save();g.translate(820+dx,560+dy);g.rotate(r);g.translate(-820,-560);if(clip)clip();
    const wob=Math.sin(hit*30)*hit*.08;g.translate(820,610);g.rotate(wob);g.translate(-820,-610);
    g.drawImage(D,x0,y0);if(u>0){g.globalAlpha=u;g.filter='grayscale(1) brightness(2.1) contrast(.75)';g.drawImage(D,x0,y0);g.filter='none';
      // creases (drawn only inside the silhouette)
      const c=I.crease;g.globalAlpha=u*.8;g.drawImage(c,x0,y0);}g.restore();};
  g.globalAlpha=.3;g.fillStyle='#000';g.beginPath();g.ellipse(820,610,30,9,0,0,7);g.fill();g.globalAlpha=1;
  if(tear<=0)draw(null,0,0,0);else{const e=ease(tear);const cut=s=>()=>{g.beginPath();const pts=[[790,560],[800,548],[808,566],[818,540],[826,560],[836,534],[850,546]];
      if(s){g.moveTo(780,440);pts.forEach(p=>g.lineTo(...p));g.lineTo(860,440);}else{g.moveTo(780,640);pts.forEach(p=>g.lineTo(...p));g.lineTo(860,640);}g.closePath();g.clip();};
    draw(cut(1),-26*e,46*e*e,-1.0*e);draw(cut(0),10*e,0,.18*e);}
  SC();if(aim>0){const [sx,sy]=P(820,525);g.save();g.globalAlpha=aim;g.strokeStyle='#78e4e8';g.lineWidth=2;const b=50*R+3*Math.sin(t*6);[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([a,c])=>{g.beginPath();g.moveTo(sx+a*b*.7,sy+c*b);g.lineTo(sx+a*b*.7,sy+c*(b-10));g.moveTo(sx+a*b*.7,sy+c*b);g.lineTo(sx+a*(b*.7-10),sy+c*b);g.stroke();});g.restore();}}
function scraps(u,seed){if(u<=0)return;const rn=rnd(seed);W2();for(let i=0;i<16;i++){const an=-Math.PI*(.1+rn()*.8),sp=40+rn()*70,x=812+Math.cos(an)*sp*u,y=545+Math.sin(an)*sp*u+120*u*u;
  if(y>612)continue;g.save();g.translate(x,y);g.rotate(rn()*7+u*8);g.globalAlpha=1-u*.5;g.fillStyle=rn()<.5?'#efe8d8':'#d8cfba';g.fillRect(-3,-2,6+rn()*4,4+rn()*3);g.restore();}SC();}
function slash(x,y,u,k){if(u<=0||u>=1)return;const [sx,sy]=P(x,y);g.save();g.globalAlpha=1-u;g.strokeStyle='#fff8e8';g.shadowColor='#fff';g.shadowBlur=10;g.lineWidth=5*(1-u)+1;
  const a0=[-.9,.6,-.2][k],r=55*R;g.beginPath();g.arc(sx-16*R,sy,r,a0-1.1*u,a0+.9+.3*u);g.stroke();g.restore();}

// ---- UI: one objective pill, one caption line, a pointer for taps ---------------------------------
function caption(s){if(!s)return;g.save();let z=24;g.font=`${z}px Plex`;const w=g.measureText(s).width+44;g.fillStyle='rgba(6,10,14,.82)';rr(W/2-w/2,H-BOT/2-20,w,40,8);g.fill();text(s,W/2,H-BOT/2,z,'#e8eef2');g.restore();}
function objective(s,done){g.save();g.font='20px Plex';const w=g.measureText(s).width+58;g.fillStyle='rgba(6,10,14,.85)';rr(W/2-w/2,8,w,34,17);g.fill();
  g.strokeStyle=done?'#7be3a0':'#78e4e8';g.lineWidth=1.5;g.stroke();text(done?'✓':'◆',W/2-w/2+22,25,18,done?'#7be3a0':'#78e4e8');text(s,W/2+12,26,20,'#e8eef2');g.restore();}
function pointer(wx,wy,press){const [x,y]=P(wx,wy);g.save();g.translate(x,y);g.scale(press?.9:1,press?.9:1);g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=2;g.beginPath();g.moveTo(0,0);g.lineTo(0,26);g.lineTo(7,20);g.lineTo(12,31);g.lineTo(17,29);g.lineTo(12,18);g.lineTo(21,18);g.closePath();g.fill();g.stroke();
  if(press){g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=2;g.beginPath();g.arc(0,0,14,0,7);g.stroke();}g.restore();}
// ---- peel / fly helpers --------------------------------------------------------
function bez(a,c,b,u){return {x:(1-u)*(1-u)*a.x+2*u*(1-u)*c.x+u*u*b.x,y:(1-u)*(1-u)*a.y+2*u*(1-u)*c.y+u*u*b.y};}
// letter i peels at t0+i*st: curls up off the surface (squash in y, lifts), then swirls to the hand
function peelFn(t,t0,st,to,n){return (i,lx,ly)=>{const u=(t-t0-i*st)/.75;if(u<=0)return null;if(u>=1)return {off:1};
  const lift=cl(u/.3,0,1),fl=cl((u-.3)/.7,0,1),a={x:lx,y:ly-lift*5},c={x:(lx+to.x)/2+(i-n/2)*10,y:Math.min(ly,to.y)-40},p=bez(a,c,to,ease(fl));
  return {x:p.x,y:p.y,rot:fl*(i%2?-3:3)+lift*.3,s:lerp(1,.45,ease(fl)),sy:lift<1?1-.7*Math.sin(lift*Math.PI):1,a:1,glow:fl>0};};}
function flyFn(from,to,u,n,arc=50,spin=0){return (i)=>{const v=cl(u*1.25-i*.06,0,1);if(v>=1)return {off:1};const c={x:(from.x+to.x)/2,y:Math.min(from.y,to.y)-arc},p=bez(from,c,to,ease(v));
  return {x:p.x+(i-n/2)*8*v*0+(i-(n-1)/2)*lerp(4,9,v),y:p.y,rot:spin*v*(i%2?1:-1),s:lerp(.7,1.25,Math.sin(v*Math.PI)*.6+v*.6),a:1,glow:true};};}

const NA='assets/';
const J2=async n=>[await img(NA+n+'.png'),(await (await fetch(NA+n+'.json')).json()).frames];
let T12;  // timing data
// ---- schedule: a list of anims played back to back with per-frame durations + hit-stop -------------------
function sched(list,t0,speed=1){const S=[];let t=t0,step0=0;for(const an of list){const d=T12.anims[an];let last=0;
  d.dur_ms.forEach((ms,k)=>{const hs=(d.hitstop_ms[k]||0)/1000/speed,du=ms/1000/speed;S.push({an,k,t0:t,t1:t+du+hs,stopEnd:t+hs,hs,ev:d.events[k],step:step0+d.step_px[k]});t+=du+hs;last=d.step_px[k];});step0+=last;}
  return {S,t0,t1:t,stepEnd:step0};}
function at(sc,t){if(t<sc.t0)return null;for(const s of sc.S)if(t<s.t1)return s;return {...sc.S.at(-1),done:true};}
function evTime(sc,name,an){const s=sc.S.find(s=>s.ev===name&&(!an||s.an===an));return s?s.t0:1e9;}
function evTimes(sc,name){return sc.S.filter(s=>s.ev===name).map(s=>s);}
// new-sheet Noor (root motion along the facing, x0.78 sprite scale)
function noorN(s,dir,x,y){const d=DV[dir],o=(s?s.step:0)*NS;const px=x+d[0]*o,py=y+d[1]*o*.6;noorAt(s?'noor_'+s.an:'noor_idle',dir,s?s.k:0,px,py);return {x:px,y:py};}
function handN(s,dir,x,y){const a=T12.anims[s.an].hand[dir][s.k],d=DV[dir],o=(s.step||0)*NS;return {x:x+d[0]*o+(a[0]-96)*NS,y:y+d[1]*o*.6+(a[1]-160)*NS};}
const relSeg=sc=>sc.S.find(s=>s.ev==='release');
function spark(x,y,u,big){if(u<0||u>1)return;W2();g.save();g.translate(x,y);g.strokeStyle='#fffbe8';g.shadowColor='#fff';g.shadowBlur=8;g.lineCap='round';
  const n=big?8:6;for(let i=0;i<n;i++){const a=i/n*6.283+.3,r0=4+u*10,r1=r0+(big?16:11)*(1-u);g.globalAlpha=1-u;g.lineWidth=2.4*(1-u)+.6;g.beginPath();g.moveTo(Math.cos(a)*r0,Math.sin(a)*r0*.7);g.lineTo(Math.cos(a)*r1,Math.sin(a)*r1*.7);g.stroke();}g.restore();SC();}
function dummyHit(paper,wob,flash,t){dummy(paper,0,wob,t,0);if(flash>0){W2();g.globalAlpha=flash;g.filter='brightness(4) saturate(0)';g.drawImage(I.D,820-27,610-158);SC();}}
function chargeRing(x,y,u,t){W2();g.save();g.strokeStyle='#78e4e8';g.shadowColor='#78e4e8';g.shadowBlur=10;g.lineWidth=1.6;g.globalAlpha=.4+.5*u;
  const r=22-12*u+1.5*Math.sin(t*20);g.beginPath();g.ellipse(x,y,r,r*.75,0,0,7);g.stroke();g.restore();SC();}
function beam(a,b,u){if(u<0||u>1)return;W2();g.save();g.lineCap='round';const w=(1-u);g.shadowColor='#78e4e8';g.shadowBlur=18;
  g.strokeStyle=`rgba(120,228,232,${.8*w})`;g.lineWidth=12*w+2;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
  g.strokeStyle=`rgba(240,255,255,${w})`;g.lineWidth=4*w+1;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.restore();SC();}
function label(s,x,y,col='#e8eef2',size=18,al='left'){g.save();g.font=`${size}px Plex`;const w=g.measureText(s).width;g.fillStyle='rgba(6,10,14,.78)';
  rr(al=='center'?x-w/2-10:x-10,y-size*.8,w+20,size*1.6,6);g.fill();text(s,x,y,size,col,al);g.restore();}
function room(){W2();g.drawImage(I.office,0,0);g.drawImage(I.door[0],112,62);SC();}
// ---- shared fight beats (combo / throw / beam) ----------------------------------------------------
const F0={x:752,y:612}, CHEST={x:820,y:522};
function hitState(sc,t){// dummy wobble (after the stop), white flash during the stop, spark from contact
  let wob=0,flash=0,shake=0;for(const s of sc.S){if(s.ev!=='hit'&&!(s.ev==='release'&&s.an==='release'))continue;const big=s.an==='combo3'||s.an==='release';
    if(t>=s.t0&&t<s.stopEnd){flash=.75;shake=big?3:2;}const u=(t-s.stopEnd)/.45;if(u>=0&&u<1)wob=Math.max(wob,(1-u)*(big?1.4:1));spark(CHEST.x-6,CHEST.y,(t-s.t0)/.22,big);}
  return {wob,flash,shake};}
// ---- FLOW (default) ----------------------------------------------------------------------------
let SC1,SC1b,SCP,SCT,SCB;
function build(){SC1=sched(['combo1','combo2','combo3'],0.6);SC1b=sched(['combo1','combo2','combo3'],SC1.t1+0.7);
  SCP=sched(['peel'],6.0);SCT=sched(['throw'],9.6);
  SCB=sched(['charge_in'],13.0);const hold=sched(['charge_hold'],SCB.t1);const loopLen=hold.t1-hold.t0;SCB.hold={t0:SCB.t1,n:2,len:loopLen};
  SCB.rel=sched(['release'],SCB.t1+2*loopLen);}
function holdAt(t){const h=SCB.hold,d=T12.anims.charge_hold;let u=((t-h.t0)%h.len)*1000,k=0;while(u>=d.dur_ms[k]){u-=d.dur_ms[k];k++;}return {an:'charge_hold',k,step:0};}
function fade(t,a,b){if(VIEW[0]===R&&t>=a&&t<b){g.setTransform(1,0,0,1,0,0);g.fillStyle=`rgba(0,0,0,${Math.max(0,1-(t-a)/.35)})`;g.fillRect(0,0,W,H);}}
function scene(t,V,focus){VIEW=V.slice();let cap='',obj='Practice: the dummy',tag='';
  const {PAPER,ARMORED,OPEN}=WORDS;
  if(t<5.6){// COMBO x2, real speed
    const sc=t<SC1.t1+0.35?SC1:SC1b;const s=at(sc,t),hs=hitState(sc,t);if(hs.shake)VIEW=[V[0],V[1]+(Math.random()-.5)*hs.shake*2,V[2]+(Math.random()-.5)*hs.shake];
    room();dummyHit(0,hs.wob,hs.flash,t);noorN(s&&!s.done?s:null,'E',F0.x,F0.y);
    cap='Tap: jab · swipe · spin. Real speed, with hit-stop.';tag=s&&!s.done?`${s.an} f${s.k}${s.ev?' · '+s.ev.toUpperCase():''}${t<s.stopEnd?' · HIT-STOP':''}`:'idle';fade(t,0,.35);
  } else if(t<9.2){// PEEL a word off the whiteboard
    room();const n={x:612,y:236,dir:'N'};const s=at(SCP,t);const live=s&&!s.done;noorN(live?s:null,'N',n.x,n.y);
