<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="screen-orientation" content="landscape" />
<title>Prompt Injection - Phase 1</title>
<style>
  @font-face { font-family: 'JetBrains Mono'; src: url('./assets/fonts/JetBrainsMono[wght].ttf') format('truetype'); font-weight: 100 800; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('./assets/fonts/IBMPlexMono-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('./assets/fonts/IBMPlexMono-Medium.ttf') format('truetype'); font-weight: 500; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #04080c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* mobile fix (art-v9): keep the canvas out from under a landscape notch / rounded corner, and never let a touch drag pan the page */
  html, body { position: fixed; inset: 0; overscroll-behavior: none; }
  #game { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); touch-action: none; }
  canvas { display: block; }
  #rotate { display: none; position: fixed; inset: 0; color: #B4EEF0; font: 700 18px 'JetBrains Mono', monospace; align-items: center; justify-content: center; background: #04080c; z-index: 9; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate">ROTATE TO LANDSCAPE</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
